name: Update Merged Rules

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Script
        run: python main.py

      - name: Commit and Force Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rules.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update rules"
            # 无论远端有什么变动，直接强制推流覆盖，彻底消除拒绝提示
            git push --force origin HEAD:${{ github.ref_name }}
          fi
