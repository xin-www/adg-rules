name: Update Merged Rules

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

# 必须声明写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Script
        run: python main.py

      # 使用官方推荐的成熟推送工具，自动处理变基、提交与推送，杜绝冲突报错
      - name: Push Rules
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update rules"
          file_pattern: "rules.txt"
