name: Update Merged Rules

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Script
        run: python main.py

      - name: Force Deploy to Rules Branch
        run: |

          mkdir -p deploy
          mv rules.txt deploy/
          cd deploy
          
          git init
          git checkout -b rules
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add rules.txt
          git commit -m "Auto update rules [$(date -u +'%Y-%m-%d %H:%M:%S')]"
          
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" rules:rules
