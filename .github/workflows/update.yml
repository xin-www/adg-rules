name: Update Merged Rules

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Script
        run: python main.py

      # 不使用 git push，直接发布为 Release 资产，彻底避免任何分支冲突与被拒
      - name: Upload Rules to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Merged Rules"
          files: rules.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
